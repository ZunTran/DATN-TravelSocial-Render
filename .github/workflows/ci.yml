name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx nx run-many -t test --all --parallel=2

      - name: Build auth-service
        run: npx nx build auth-service

      - name: Build user-service
        run: npx nx build user-service

      - name: Build social-service
        run: npx nx build social-service

      - name: Build api-gateway
        run: npx nx build api-gateway

      - name: Build frontend
        run: npm run build --workspace=web
        env:
          NEXT_PUBLIC_GRAPHQL_URL: https://ci.example.com/graphql
